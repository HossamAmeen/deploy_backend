services:
  backend:
    build:
      context: ../..
      dockerfile: ${DOCKERFILE:-docker/production/Dockerfile}
    env_file: ../../.env
    environment:
      DJANGO_DB_PATH: /data/db.sqlite3
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ../../data:/data
      - ../../staticfiles:/app/staticfiles
      - ../../media:/app/media
    restart: unless-stopped
